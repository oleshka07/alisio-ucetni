# /etc/nginx/sites-available/ucetni.rozum.one
# ln -s /etc/nginx/sites-available/ucetni.rozum.one /etc/nginx/sites-enabled/
# certbot --nginx -d ucetni.rozum.one
server {
    listen 80;
    server_name ucetni.rozum.one;

    client_max_body_size 25m;   # завантаження документів до 20 МБ

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # AI-розпізнавання, синхронізація пошти
    }
}
