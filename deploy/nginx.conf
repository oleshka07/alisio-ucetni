# /etc/nginx/sites-available/ucetni.swipescape.eu
# ln -s /etc/nginx/sites-available/ucetni.swipescape.eu /etc/nginx/sites-enabled/
# certbot --nginx -d ucetni.swipescape.eu
server {
    listen 80;
    server_name ucetni.swipescape.eu;

    client_max_body_size 25m;   # завантаження документів до 20 МБ

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # AI-розпізнавання, синхронізація пошти
    }
}
